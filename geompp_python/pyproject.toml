[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "geompp"
version = "0.8.0"
description = "Python bindings for geompp — a C++ 2D/3D geometry library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "geometry", "2d", "3d", "spatial", "math", "computational-geometry",
    "polygon", "polyline", "point-cloud", "convex-hull", "bounding-box",
    "cpp", "c++", "cad", "gis",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.urls]
Homepage   = "https://github.com/amastrobera/geompp"
Repository = "https://github.com/amastrobera/geompp"
Changelog  = "https://github.com/amastrobera/geompp/blob/master/CHANGELOG.md"

# ─── scikit-build-core configuration ─────────────────────────────────────────

[tool.scikit-build]
cmake.build-type = "Release"

# The Python package directory to include in the wheel
wheel.packages = ["geompp"]

# NOTE: The geompp C++ core lives in a sibling directory (../geompp/) in the
# monorepo. scikit-build-core's sdist.include cannot reach paths above the
# project root, so the core sources are NOT bundled in the sdist. Instead,
# CMakeLists.txt detects their absence at configure time and fetches them from
# GitHub via FetchContent (see the "sdist standalone" section in CMakeLists.txt).
# To build from the sdist without network access, clone the full monorepo and
# run `pip install ./geompp_python` instead.

[tool.scikit-build.cmake.define]
# Silence glog's own tests/examples during build
WITH_GFLAGS   = "OFF"
WITH_GTEST    = "OFF"
BUILD_TESTING = "OFF"

# ─── cibuildwheel (optional, for CI wheel building) ──────────────────────────
[tool.cibuildwheel]
# TODO end of 2026: drop cp38-* and cp39-* (both EOL) to shorten CI
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip  = "*-win32 *_i686 *-musllinux*"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
