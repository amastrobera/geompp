name: Build / Test (Windows)

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python build tools
        run: pip install scikit-build-core pybind11 pytest

      - name: Configure CMake (C++ + Python bindings)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=ON

      - name: Build
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS

      - name: Run C++ tests
        run: ctest --test-dir build/geompp_tests --build-config Release --output-on-failure

      # ── C# smoke tests ───────────────────────────────────────────────────────
      - name: Build GeomPP.dll (.NET Framework 4.8)
        run: |
          msbuild geompp_csharp\GeomPP_Net48.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GeomppBuildRoot="${{ github.workspace }}\build"

      - name: Run C# smoke tests
        run: dotnet run --project geompp_csharp\tests\GeomPPTests.csproj -p:GeomPPConfiguration=Release_Net48

      # ── Python smoke tests ───────────────────────────────────────────────────
      - name: Install Python bindings
        run: pip install "./geompp_python[dev]"

      - name: Run Python tests
        run: pytest geompp_python/tests/ -v
