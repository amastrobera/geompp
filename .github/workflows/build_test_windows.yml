name: Build / Test (Windows)

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: pip install scikit-build-core pybind11 pytest

      - name: Configure CMake (C++ + Python bindings)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON=ON

      - name: Build
        run: cmake --build build -j $env:NUMBER_OF_PROCESSORS

      - name: Run C++ tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install Python bindings
        run: pip install "./geompp_python[dev]"

      - name: Run Python tests
        run: pytest geompp_python/tests/ -v
