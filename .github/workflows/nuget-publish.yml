name: Publish NuGet

# Triggers on C# version tags: csharp-v0.1.1, csharp-v1.2.3, etc.
# Can also be triggered manually from the Actions tab.
on:
  push:
    tags:
      - "csharp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. csharp-v0.1.1)'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      - uses: actions/checkout@v4

      # Sets up MSVC compiler + linker on PATH so Ninja can find cl.exe
      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Puts MSBuild on PATH (needed for the C++/CLI vcxproj)
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # Puts nuget.exe on PATH
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      # Build only the geompp static library (skips tests and samples)
      - name: Build geompp (C++ static library)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target geompp

      # Build the C++/CLI wrapper DLL targeting .NET 10 (CoreCLR, /clr:netcore).
      # Output: geompp_csharp\x64\Release\GeomPP.dll
      - name: Build GeomPP.dll (.NET 10)
        run: |
          msbuild geompp_csharp\GeomPP.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GeomppBuildRoot="${{ github.workspace }}\build"

      # Build the same sources targeting .NET Framework 4.8 (classic CLR, /clr).
      # Output: geompp_csharp\x64\Release_Net48\GeomPP.dll
      - name: Build GeomPP.dll (.NET Framework 4.8)
        run: |
          msbuild geompp_csharp\GeomPP_Net48.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GeomppBuildRoot="${{ github.workspace }}\build"

      # Resolve tag and version (supports both push-tag and manual dispatch)
      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $v   = $tag -replace '^csharp-v', ''
          "TAG=$tag" | Out-File -Append $env:GITHUB_OUTPUT
          "VERSION=$v" | Out-File -Append $env:GITHUB_OUTPUT

      # Pull the matching section out of CHANGELOG.md
      - name: Extract changelog notes
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.VERSION }}"
          $text    = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $m = [regex]::Match($text, "(?s)## \[$escaped\][^\n]*\n(.*?)(?=\n## \[|\z)")
          if ($m.Success) {
              $m.Groups[1].Value.Trim() | Set-Content notes.txt
          } else {
              "Release $version" | Set-Content notes.txt
          }

      # Inject the extracted notes into the nuspec before packing
      - name: Inject release notes into nuspec
        shell: pwsh
        run: |
          [xml]$nuspec = Get-Content geompp_csharp\GeomPP.nuspec
          $nuspec.package.metadata.releaseNotes = (Get-Content notes.txt -Raw).Trim()
          $nuspec.Save((Resolve-Path geompp_csharp\GeomPP.nuspec).Path)

      # Pack: reads GeomPP.nuspec which picks up both DLLs.
      - name: Pack NuGet package
        run: |
          nuget pack geompp_csharp\GeomPP.nuspec `
            -Version ${{ steps.ver.outputs.VERSION }} `
            -OutputDirectory nupkgs

      # Push to NuGet.org. -SkipDuplicate makes re-runs of the same tag safe.
      # Add NUGET_API_KEY in: repo Settings → Secrets → Actions
      - name: Push to NuGet.org
        run: |
          nuget push nupkgs\*.nupkg `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKey ${{ secrets.NUGET_API_KEY }} `
            -SkipDuplicate

      # Create a GitHub Release on the csharp-v* tag with the nupkg as asset
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.ver.outputs.TAG }}" \
            --repo  "${{ github.repository }}" \
            --title "GeomPP (C#) ${{ steps.ver.outputs.TAG }}" \
            --notes-file notes.txt \
            nupkgs/*.nupkg
