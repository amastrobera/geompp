name: Release C++ (GitHub)

# Triggers on C++ version tags: v0.1.0, v1.2.3, etc.
# Can also be triggered manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true
        type: string

jobs:
  # ─── Resolve tag (works for both push-tag and manual dispatch) ────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"   >> $GITHUB_OUTPUT

  # ─── Linux: libgeompp.a + headers ────────────────────────────────────────────
  build-linux:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target geompp -j$(nproc)

      - name: Package
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          STAGEDIR="geompp-v${VERSION}-linux-x86_64"
          mkdir -p "${STAGEDIR}/lib" "${STAGEDIR}/include"
          cp build/geompp/libgeompp.a "${STAGEDIR}/lib/"
          cp -r geompp/include/.        "${STAGEDIR}/include/"
          tar -czf "${STAGEDIR}.tar.gz" "${STAGEDIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: geompp-*-linux-x86_64.tar.gz

  # ─── Windows: geompp.lib + headers ───────────────────────────────────────────
  build-windows:
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target geompp -j $env:NUMBER_OF_PROCESSORS

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.setup.outputs.version }}"
          $stage   = "geompp-v${version}-windows-x64"
          New-Item -ItemType Directory -Path "${stage}/lib", "${stage}/include" | Out-Null
          Copy-Item "build/geompp/geompp.lib"   "${stage}/lib/geompp.lib"
          Copy-Item "geompp/include/*"          "${stage}/include/" -Recurse
          Compress-Archive -Path $stage -DestinationPath "${stage}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: geompp-*-windows-x64.zip

  # ─── Create GitHub Release ────────────────────────────────────────────────────
  release:
    needs: [setup, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog notes
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          cat > /tmp/extract.py << 'PYEOF'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          m = re.search(
              r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)',
              text, re.DOTALL)
          sys.stdout.write(m.group(1).strip() if m else f'Release {version}')
          PYEOF
          python3 /tmp/extract.py "$VERSION" > notes.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-archive"
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.setup.outputs.tag }}" \
            --repo   "${{ github.repository }}" \
            --title  "geompp ${{ needs.setup.outputs.tag }}" \
            --notes-file notes.txt \
            dist/*
