name: Publish Python (PyPI)

# Triggers on Python version tags: python-v1.0.0, python-v1.2.3, etc.
# Make sure the version in geompp_python/pyproject.toml matches the tag before pushing.
# Add PYPI_API_TOKEN in: repo Settings → Secrets → Actions
on:
  push:
    tags:
      - "python-v*"

jobs:
  # ─── Binary wheels (Linux + Windows, Python 3.8–3.12) ────────────────────────
  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # cibuildwheel spins up manylinux containers on Linux and uses the
      # host MSVC toolchain on Windows; config lives in pyproject.toml
      - name: Build wheels
        uses: pypa/cibuildwheel@v2
        with:
          package-dir: geompp_python
          output-dir:  wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ─── Source distribution ──────────────────────────────────────────────────────
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist geompp_python/ --outdir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ─── Publish ──────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Push to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
